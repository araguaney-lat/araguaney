<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva respuesta a tu solicitud</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e4e4e7;">

          <!-- Header -->
          <tr>
            <td style="background:#18181b;padding:24px 32px;">
              <p style="margin:0;font-size:18px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">Araguaney</p>
              <p style="margin:4px 0 0;font-size:12px;color:#a1a1aa;">Coordinación de centros de acopio</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 8px;font-size:15px;color:#3f3f46;">Nueva respuesta en tu solicitud:</p>
              <p style="margin:0 0 24px;font-size:20px;font-weight:600;color:#18181b;">{{ request_title }}</p>

              <div style="background:#f4f4f5;border-left:3px solid #d4d4d8;border-radius:0 8px 8px 0;padding:16px 20px;margin:0 0 28px;">
                <p style="margin:0;font-size:14px;color:#3f3f46;line-height:1.6;">{{ reply_body }}</p>
              </div>

              <a href="{{ request_url }}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;">
                Ver solicitud completa
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#fafafa;border-top:1px solid #f4f4f5;padding:20px 32px;">
              <p style="margin:0;font-size:12px;color:#a1a1aa;line-height:1.5;">
                Este mensaje fue enviado porque tienes una solicitud activa en Araguaney.<br>
                Si no reconoces esta actividad, puedes ignorar este correo.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
