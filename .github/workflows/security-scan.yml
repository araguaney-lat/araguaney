name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Los avisos se publican contra un lockfile que nadie está tocando. Un escaneo
  # que solo corre cuando alguien empuja código nunca vuelve a mirar un árbol que
  # se volvió vulnerable estando quieto: el aviso de sharp (GHSA-rgj7-g3m4-5g8c)
  # salió después de la última corrida en `main` y nada lo habría notado hasta el
  # siguiente empujón. El latido semanal es lo único que atrapa eso.
  schedule:
    - cron: "0 6 * * 1"

# Un empujón nuevo cancela la corrida anterior del mismo PR, pero nunca una de
# `main`: en la rama por defecto cada commit tiene que quedar verificado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      # A newly-disclosed transitive CVE shouldn't block a PR that never touched
      # dependencies. Enforce the audit only when this PR changes package*.json
      # (or on push to main). Otherwise run it informationally — Dependabot
      # (.github/dependabot.yml) opens the fix PRs where the CVE actually lives.
      - name: Detect dependency changes
        id: deps
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- package.json package-lock.json | grep -q .; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit for HIGH/CRITICAL CVEs
        run: |
          if [ "${{ steps.deps.outputs.changed }}" = "true" ]; then
            npm audit --audit-level=high --omit=dev
          else
            npm audit --audit-level=high --omit=dev \
              || echo "::warning::CVE no relacionada con este PR (no cambió package*.json). No bloquea el merge; se atiende vía Dependabot."
          fi

  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # Same policy as npm-audit: only enforce when this PR touches
      # requirements.txt (or on push to main); otherwise informational.
      - name: Detect dependency changes
        id: deps
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- requirements.txt | grep -q .; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit for known CVEs
        run: |
          if [ "${{ steps.deps.outputs.changed }}" = "true" ]; then
            pip-audit -r requirements.txt
          else
            pip-audit -r requirements.txt \
              || echo "::warning::CVE no relacionada con este PR (no cambió requirements.txt). No bloquea el merge; se atiende vía Dependabot."
          fi
