name: Backend tests

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # pypdf: solo para pruebas. Las etiquetas se verifican leyendo el
          # texto del PDF generado, no el fuente que lo escribe.
          pip install pytest pytest-asyncio httpx pypdf
      - name: Run test suite (unit + tenant isolation)
        run: python -m pytest -q
