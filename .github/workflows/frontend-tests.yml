name: Frontend tests

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # tsc y vitest son la brecha real: hasta ahora nada en CI corría el
      # typecheck ni las pruebas del frontend. `next build` no se repite aquí
      # porque Vercel ya lo ejecuta en cada push (incluye el typecheck del build).
      - name: Typecheck
        run: npm run typecheck
      # `eslint .` falla solo ante errores; las advertencias (deuda conocida de
      # las reglas nuevas de React 19, ver eslint.config.mjs) no rompen el build.
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test
